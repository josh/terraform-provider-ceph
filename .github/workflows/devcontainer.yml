name: Devcontainer

on:
  push:
    paths:
      - .devcontainer/Dockerfile
  pull_request:
    paths:
      - .devcontainer/Dockerfile
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Build devcontainer image
        run: |
          docker build --file .devcontainer/Dockerfile .
