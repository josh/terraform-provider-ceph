name: Devcontainer

on:
  push:
    paths:
      - .devcontainer/Dockerfile
  pull_request:
    paths:
      - .devcontainer/Dockerfile
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Build devcontainer image
        run: |
          docker build --file .devcontainer/Dockerfile .
