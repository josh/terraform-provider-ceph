name: Devcontainer

on:
  push:
    paths:
      - .devcontainer/Dockerfile
  pull_request:
    paths:
      - .devcontainer/Dockerfile
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Build devcontainer image
        run: |
          docker build --file .devcontainer/Dockerfile .
