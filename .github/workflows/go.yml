name: Go

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        ceph-release:
          - squid
          - tentacle

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Add Ceph repository
        run: |
          curl -fsSL https://download.ceph.com/keys/release.asc | sudo gpg --dearmor -o /usr/share/keyrings/ceph-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/ceph-archive-keyring.gpg] https://download.ceph.com/debian-${{ matrix.ceph-release }}/ jammy main" | sudo tee /etc/apt/sources.list.d/ceph.list

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            ceph \
            ceph-mgr-dashboard \
            python3-setuptools \
            radosgw

      - name: Print Ceph version
        run: ceph --version

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.13.3
          terraform_wrapper: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.3"

      - name: Download go modules
        run: |
          go mod download

      - name: Build
        run: |
          go build

      - name: Tests
        timeout-minutes: 61
        run: |
          go test -timeout 1h
        env:
          TF_ACC: "1"
