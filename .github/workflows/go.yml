name: Go

on:
  push:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        ceph-release:
          - squid
          # - tentacle

    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Add Ceph repository
        run: |
          curl -fsSL https://download.ceph.com/keys/release.asc | sudo gpg --dearmor -o /usr/share/keyrings/ceph-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/ceph-archive-keyring.gpg] https://download.ceph.com/debian-${{ matrix.ceph-release }}/ jammy main" | sudo tee /etc/apt/sources.list.d/ceph.list

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            ceph \
            ceph-mgr-dashboard \
            python3-setuptools \
            radosgw

      - name: Print Ceph version
        run: ceph --version

      - uses: hashicorp/setup-terraform@v3.1.2
        with:
          terraform_version: 1.13.3
          terraform_wrapper: false

      - uses: actions/setup-go@4dc6199c7b1a012772edbd06daecab0f50c9053c # v6.1.0
        with:
          go-version: "~1.25.4"

      - name: Download go modules
        run: |
          go mod download

      - name: Build
        run: |
          go build

      - name: Tests
        timeout-minutes: 61
        run: |
          go test -timeout 1h
        env:
          TF_ACC: "1"
